# Contrato da API — fonte: docs/04-contrato-graphql.md

scalar DateTime   # ISO-8601 (ex.: "2026-11-06T00:00:00.000Z")

enum TransactionType {
  INCOME
  EXPENSE
}

type User {
  id: ID!
  name: String!
  email: String!
  createdAt: DateTime!
}

type AuthPayload {
  token: String!
  user: User!
}

type Category {
  id: ID!
  title: String!
  description: String
  icon: String!
  color: String!
  "Quantidade de transações nesta categoria"
  transactionsCount: Int!
  "Soma em centavos (receitas − despesas) das transações da categoria"
  totalAmount: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Transaction {
  id: ID!
  description: String!
  "Centavos, sempre positivo"
  amount: Int!
  type: TransactionType!
  date: DateTime!
  category: Category
  createdAt: DateTime!
  updatedAt: DateTime!
}

type TransactionPage {
  items: [Transaction!]!
  total: Int!
  page: Int!
  perPage: Int!
  totalPages: Int!
}

type Summary {
  "Saldo de todas as transações (centavos)"
  balance: Int!
  "Receitas no mês de referência (centavos)"
  monthIncome: Int!
  "Despesas no mês de referência (centavos)"
  monthExpense: Int!
}

input SignUpInput {
  name: String!
  email: String!
  password: String!
}

input SignInInput {
  email: String!
  password: String!
}

input UpdateProfileInput {
  name: String!
}

input CategoryInput {
  title: String!
  description: String
  icon: String!
  color: String!
}

input TransactionInput {
  description: String!
  amount: Int!
  type: TransactionType!
  date: DateTime!
  categoryId: ID
}

input TransactionFilter {
  "Busca por descrição (contém, sem diferenciar maiúsculas)"
  search: String
  type: TransactionType
  categoryId: ID
  "Mês no formato YYYY-MM"
  period: String
}

type Query {
  me: User!
  categories: [Category!]!
  category(id: ID!): Category!
  transactions(filter: TransactionFilter, page: Int = 1, perPage: Int = 10): TransactionPage!
  transaction(id: ID!): Transaction!
  "Últimas N transações para o Dashboard"
  recentTransactions(limit: Int = 5): [Transaction!]!
  "month no formato YYYY-MM; padrão: mês atual"
  summary(month: String): Summary!
}

type Mutation {
  signUp(input: SignUpInput!): AuthPayload!
  signIn(input: SignInInput!): AuthPayload!
  updateProfile(input: UpdateProfileInput!): User!

  createCategory(input: CategoryInput!): Category!
  updateCategory(id: ID!, input: CategoryInput!): Category!
  deleteCategory(id: ID!): Boolean!

  createTransaction(input: TransactionInput!): Transaction!
  updateTransaction(id: ID!, input: TransactionInput!): Transaction!
  deleteTransaction(id: ID!): Boolean!
}
